name: Build Windows apps
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile translator components
        shell: pwsh
        run: ./apps/claude-live-translator/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/translator-build"
      - name: Compile home-time clock
        shell: pwsh
        run: ./apps/two-zone-clock/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/clock-build" -RunTests
      - name: Compile environment helper
        shell: pwsh
        run: ./apps/whale-claude-helper/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/helper-build"
      - name: Test environment helper with isolated fixtures
        shell: pwsh
        run: ./apps/whale-claude-helper/tests/run-fixtures.ps1
      - name: Test network, DNS, proxy and process workflows offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node ./apps/whale-claude-helper/tests/WebRtcTests.js
          if ($LASTEXITCODE -ne 0) { throw 'WebRTC fixtures failed' }
          foreach ($suite in @('run-score-measurement-tests.ps1', 'run-network-dns-tests.ps1', 'run-dns-leak-measurement-tests.ps1', 'run-network-ui-tests.ps1', 'run-codex-proxy-tests.ps1', 'run-proxy-discovery-tests.ps1', 'run-process-close-tests.ps1', 'run-codex-proxy-ui-tests.ps1')) {
            & (Join-Path './apps/whale-claude-helper/tests' $suite)
          }
      - name: Test browser locale injection with isolated constructors and JSON
        shell: pwsh
        run: ./tests/run-browser-locale-fixtures.ps1
      - name: Build and test Pack Helper with generated fixtures
        shell: pwsh
        run: ./apps/whale-pack-helper/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/pack-helper-build"
      - name: Test glossary and session history without live windows
        shell: pwsh
        run: ./apps/claude-live-translator/tests/run-glossary-history.ps1 -OutputDirectory "$env:RUNNER_TEMP/translator-tests" -PythonPath (Get-Command python).Source
      - name: Test translation workers with fake providers
        shell: pwsh
        working-directory: apps/claude-live-translator/tests
        run: python -m unittest test_google_worker test_offline_worker test_glossary
      - name: Test update selection and verified downloads offline
        shell: pwsh
        run: ./shared/tests/run-fixtures.ps1
      - name: Test portable launcher allowlist without extracting or launching
        shell: pwsh
        run: ./apps/claude-live-translator/packaging/run-launcher-tests.ps1
      - name: Validate Python syntax without running workers
        shell: pwsh
        run: python -m compileall -q apps/claude-live-translator/backend
      - name: Keep isolated test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helper-fixture-results
          path: apps/whale-claude-helper/artifacts/helper-tests/fixture-results.json
          if-no-files-found: ignore
      - name: Store build outputs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-components-not-portable-translator
          path: |
            ${{ runner.temp }}/translator-build/*
            ${{ runner.temp }}/clock-build/*
            ${{ runner.temp }}/helper-build/*
            ${{ runner.temp }}/pack-helper-build/*

  acceptance:
    # GitHub's Windows runner is a disposable VM, so real system changes are safe here and nowhere else.
    name: Windows acceptance on a disposable runner
    runs-on: windows-latest
    needs: build
    timeout-minutes: 20
    env:
      # Scripts also require GITHUB_ACTIONS=true and github-hosted Windows.
      WHALE_E2E_ALLOW_SYSTEM_CHANGES: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Change the real time zone with the helper, then undo it
        shell: pwsh
        run: ./apps/whale-claude-helper/tests/run-e2e-timezone.ps1
      - name: Apply, verify and undo temporary Windows workflow fixtures
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/run-windows-acceptance.ps1
      - name: Build the four apps for a launch check
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./apps/whale-claude-helper/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/launch/helper"
          ./apps/claude-live-translator/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/launch/translator"
          ./apps/two-zone-clock/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/launch/clock"
          ./apps/whale-pack-helper/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/launch/pack" -SkipTests
          # Pack Helper 0.1.1 must start without its old .exe.config sidecar.
          Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/launch/pack" -Filter '*.exe.config' | Remove-Item -Force
      - name: Launch each app and keep a screenshot
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'launch'
          ./.github/scripts/launch-smoke.ps1 -ScreenshotDirectory (Join-Path $env:RUNNER_TEMP 'launch-screenshots') -Executable @(
            (Get-ChildItem -LiteralPath (Join-Path $root 'helper') -Filter '*.exe' | Select-Object -First 1).FullName,
            (Join-Path $root 'translator/ClaudeChinese.exe'),
            (Join-Path $root 'clock/TwoZoneClock.exe'),
            (Get-ChildItem -LiteralPath (Join-Path $root 'pack') -Filter '*.exe' | Where-Object Name -notlike 'WhalePack.Tests*' | Select-Object -First 1).FullName
          )
      - name: Render clock reset previews with synthetic data only
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/scripts/clock-previews.ps1 -Executable "$env:RUNNER_TEMP/launch/clock/TwoZoneClock.exe" -ScreenshotDirectory "$env:RUNNER_TEMP/clock-reset-previews"
      - name: Keep clock reset previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clock-reset-previews
          path: ${{ runner.temp }}/clock-reset-previews/*
          if-no-files-found: warn
      - name: Keep launch screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-screenshots
          path: ${{ runner.temp }}/launch-screenshots/*
          if-no-files-found: warn
      - name: Keep apply and rollback acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-receipts
          path: ${{ runner.temp }}/acceptance-results/*.json
          if-no-files-found: warn
